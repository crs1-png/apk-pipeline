name: Build APK to Google Drive

# Generic run title so nothing project-specific shows up in the run list
run-name: Build APK

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo as owner/name (masked in logs)"
        required: true
      branch:
        description: "Branch to build (masked in logs)"
        required: true
        default: "main"
      project_path:
        description: "Path to the Flutter project inside the repo"
        required: false
        default: "."
      flutter_version:
        description: "Flutter version, e.g. 3.24.5 (empty = latest stable)"
        required: false
        default: ""
      build_mode:
        description: "Build mode"
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Reads inputs from the event file (values are never printed),
      # masks them, and passes them on via environment variables.
      - name: Read and mask inputs
        run: |
          set -euo pipefail
          REPO=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          BRANCH=$(jq -r '.inputs.branch // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          PROJECT_PATH=$(jq -r '.inputs.project_path // "."' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          [ -z "$PROJECT_PATH" ] && PROJECT_PATH="."

          if ! [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repo format. Expected owner/name."
            exit 1
          fi
          if [ -z "$BRANCH" ]; then
            echo "Branch is empty."
            exit 1
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          for v in "$REPO" "$OWNER" "$NAME" "$BRANCH"; do
            # Skip very short values, masking them would garble the whole log
            if [ ${#v} -ge 3 ]; then echo "::add-mask::$v"; fi
          done
          if [ "$PROJECT_PATH" != "." ] && [ ${#PROJECT_PATH} -ge 3 ]; then
            echo "::add-mask::$PROJECT_PATH"
          fi

          {
            echo "SRC_REPO=$REPO"
            echo "SRC_REPO_NAME=$NAME"
            echo "SRC_BRANCH=$BRANCH"
            echo "SRC_PROJECT_PATH=$PROJECT_PATH"
          } >> "$GITHUB_ENV"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_BRANCH }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: src
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      # Removes machine-specific settings from the cloned copy (e.g. a Windows
      # JDK path in gradle.properties) and points Gradle/Flutter to the runner's JDK.
      # The source repository itself is not changed.
      - name: Prepare Android build environment
        run: |
          set -euo pipefail
          cd "src/$SRC_PROJECT_PATH"

          # Remove hard-coded JDK paths from all project gradle.properties files
          find . -name gradle.properties -not -path "*/build/*" -print0 | while IFS= read -r -d '' f; do
            sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' "$f"
          done

          # local.properties contains local SDK paths. Flutter recreates it.
          rm -f android/local.properties

          # User-level Gradle settings override project settings
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

          flutter config --jdk-dir="$JAVA_HOME" > /dev/null

      # Build output goes to a file instead of the public log.
      # On failure the log is uploaded to Google Drive.
      - name: Build APK (output hidden from public log)
        id: build
        continue-on-error: true
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          cd "src/$SRC_PROJECT_PATH"
          {
            flutter --version
            flutter pub get
            flutter build apk --"$BUILD_MODE"
          } > "$GITHUB_WORKSPACE/build.log" 2>&1

      # Uploads directly via the Google Drive REST API (curl + jq, both preinstalled).
      - name: Upload to Google Drive
        if: always()
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail

          for v in GDRIVE_CLIENT_ID GDRIVE_CLIENT_SECRET GDRIVE_REFRESH_TOKEN GDRIVE_FOLDER_ID; do
            if [ -z "${!v:-}" ]; then echo "Missing secret: $v"; exit 1; fi
          done

          # 1) Exchange the refresh token for a short-lived access token (valid 1 hour)
          TOKEN_JSON=$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${GDRIVE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GDRIVE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GDRIVE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Could not get a Google access token:"
            echo "$TOKEN_JSON" | jq -r '.error, .error_description' || true
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"

          # Calls the Drive API, prints the response body, fails on HTTP errors
          drive_api() {
            local out code
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" "$@") || code="000"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Drive API error (HTTP $code): $(jq -r '.error.message // empty' "$out" 2>/dev/null)" >&2
              return 1
            fi
            cat "$out"
          }

          # Returns the ID of subfolder <name> in <parent>, creates it if missing
          get_or_create_folder() {
            local name="$1" parent="$2" id meta
            id=$(drive_api -G "https://www.googleapis.com/drive/v3/files" \
              --data-urlencode "q=name = '${name}' and mimeType = 'application/vnd.google-apps.folder' and '${parent}' in parents and trashed = false" \
              --data-urlencode "fields=files(id)" \
              --data-urlencode "supportsAllDrives=true" \
              --data-urlencode "includeItemsFromAllDrives=true" \
              | jq -r '.files[0].id // empty') || return 1
            if [ -z "$id" ]; then
              meta=$(jq -nc --arg n "$name" --arg p "$parent" \
                '{name: $n, mimeType: "application/vnd.google-apps.folder", parents: [$p]}')
              id=$(drive_api -X POST "https://www.googleapis.com/drive/v3/files?fields=id&supportsAllDrives=true" \
                -H "Content-Type: application/json; charset=UTF-8" \
                -d "$meta" | jq -r '.id // empty') || return 1
            fi
            [ -n "$id" ] || return 1
            echo "$id"
          }

          # Resumable upload (works for files of any size)
          upload_file() {
            local file="$1" name="$2" parent="$3" mime="$4" size meta headers body code session
            size=$(stat -c%s "$file")
            meta=$(jq -nc --arg n "$name" --arg p "$parent" '{name: $n, parents: [$p]}')
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' -X POST \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: ${mime}" \
              -H "X-Upload-Content-Length: ${size}" \
              -d "$meta") || code="000"
            session=$(tr -d '\r' < "$headers" | awk 'tolower($1) == "location:" {print $2}')
            if [ "$code" != "200" ] || [ -z "$session" ]; then
              echo "Could not start upload (HTTP $code): $(jq -r '.error.message // empty' "$body" 2>/dev/null)" >&2
              return 1
            fi
            drive_api -X PUT "$session" -H "Content-Type: ${mime}" --upload-file "$file" > /dev/null
          }

          # 2) Build file names
          SAFE_BRANCH=$(echo "$SRC_BRANCH" | tr '/ ' '--')
          SHORT_SHA=$(git -C src rev-parse --short HEAD 2>/dev/null || echo "nosha")
          STAMP=$(TZ=Europe/Berlin date +%Y%m%d-%H%M)
          BASE="${SRC_REPO_NAME}-${SAFE_BRANCH}-${STAMP}-${SHORT_SHA}-${BUILD_MODE}"
          APK="src/${SRC_PROJECT_PATH}/build/app/outputs/flutter-apk/app-${BUILD_MODE}.apk"

          # 3) One subfolder per repo inside the Drive folder
          REPO_FOLDER_ID=$(get_or_create_folder "$SRC_REPO_NAME" "$GDRIVE_FOLDER_ID")
          echo "::add-mask::$REPO_FOLDER_ID"

          # 4) Upload APK, and the build log if the build failed
          if [ -f "$APK" ]; then
            upload_file "$APK" "${BASE}.apk" "$REPO_FOLDER_ID" "application/vnd.android.package-archive"
            echo "APK uploaded to Google Drive." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$BUILD_OUTCOME" != "success" ] && [ -f build.log ]; then
            upload_file build.log "${BASE}-FAILED.log" "$REPO_FOLDER_ID" "text/plain"
            echo "Build failed. Log uploaded to Google Drive." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Build failed. The full log was uploaded to Google Drive."
          exit 1
